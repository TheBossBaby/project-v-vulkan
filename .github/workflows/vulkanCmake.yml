name: CMake (Vulkan backend)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Debug
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-windows-msvc:
    runs-on: windows-latest

    steps:
      - name: Install Vulkan SDK
        shell: powershell
        run: |
          choco install vulkan-sdk --yes
          $sdk = Get-ChildItem 'C:\VulkanSDK' | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=C:\VulkanSDK\$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\VulkanSDK\$($sdk.Name)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ env.BUILD_TYPE }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-${{ env.BUILD_TYPE }}-${{ github.ref_name }}-
            cmake-${{ runner.os }}-${{ env.BUILD_TYPE }}-

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build Vulkan backend
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }} --target projectv_vulkan